<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <style>
    #image {
      width: 500px;
      height: 350px;
      background-size: cover;
      background-position: center;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb { width: 150px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="image">
    <p>Hover over an image below to display here.</p>
  </div>

  <img class="thumb" src="https://picsum.photos/id/10/500/350" alt="Rừng cây" onmouseover="upDate(this)" onmouseout="undo()">
  <img class="thumb" src="https://picsum.photos/id/20/500/350" alt="Bàn làm việc" onmouseover="upDate(this)" onmouseout="undo()">
  <img class="thumb" src="https://picsum.photos/id/30/500/350" alt="Bờ biển" onmouseover="upDate(this)" onmouseout="undo()">

  <script>
    const imageDiv = document.getElementById('image');
    const originalText = 'Hover over an image below to display here.';

    function upDate(previewPic) {
      
      console.log('upDate được gọi');
      console.log('alt:', previewPic.alt);
      console.log('src:', previewPic.src);

   
      imageDiv.textContent = previewPic.alt;


      imageDiv.style.backgroundImage = `url("${previewPic.src}")`;
    }

    function undo() {
      console.log('undo được gọi');

      // Xóa ảnh nền
      imageDiv.style.backgroundImage = '';


      imageDiv.textContent = originalText;
    }
  </script>
</body>
</html>
